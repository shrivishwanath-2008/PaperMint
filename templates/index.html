<!DOCTYPE html>
<html>
<head>
    <title>PaperMint - Home</title>
    <link rel="icon" href="/static/logo.png">

    <style>
    :root {
        --bg: #000;
        --surface: #202124;
        --text: #e8eaed;
        --sub: #9aa0a6;
        --accent: #8ab4f8;
        --border: #3c4043;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    /* NAVBAR */
    .navbar {
        display: flex;
        justify-content: space-between;
        padding: 15px 40px;
        border-bottom: 1px solid var(--border);
    }

    .nav-links a {
        margin-left: 20px;
        text-decoration: none;
        color: var(--text);
    }

    .nav-links a:hover {
        color: var(--accent);
    }

    /* HERO */
    .hero {
        text-align: center;
        margin-top: 18vh;
    }

    h1 {
        font-size: 3em;
        font-weight: 300;
    }

    .tagline {
        color: var(--sub);
        margin-bottom: 30px;
    }

    .btn {
        background: var(--accent);
        color: black;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
    }

    </style>
</head>

<body>

    <div class="navbar">
        <div><strong>PaperMint</strong></div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/app">Get Started</a>
        </div>
    </div>

    <div class="hero">
        <h1>PaperMint</h1>
        <p class="tagline">AI-powered PDF generation in seconds</p>

        <a href="/app" class="btn">Get Started</a>
    </div>

</body>
</html>
