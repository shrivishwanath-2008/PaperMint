<!DOCTYPE html>
<html>
<head>
    <title>PaperMint</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div id="loader-container">
        <div id="loader-text">Loading...</div>
        <div id="loader-bar"></div>
    </div>

    <div class="navbar">
        <div><strong>PaperMint</strong></div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/app">Get Started</a>
        </div>
    </div>

    <div class="container">

        <h1>PaperMint</h1>
        <p class="tagline">Ask the AI PDF Maker to create your document.</p>

        <form id="generateForm" onsubmit="return false;">

            <div class="main-input">
                <textarea name="content" placeholder="Generate a resume for a Python developer, focusing on FastAPI." required></textarea>
            </div>

            <div class="options">

                <div class="left-options">

                    <div>
                        <label>Template</label><br>
                        <select name="template_type">
                            {% for t in templates %}
                                <option value="{{ t }}">{{ t | capitalize }}</option>
                            {% endfor %}
                        </select>
                    </div>

                </div>

                <button type="button" onclick="generatePDF()">Generate PDF</button>

            </div>

        </form>

    </div>

    <div id="toast" class="toast">Could not generate the document. Please try again.</div>

    <script src="/static/script.js"></script>

</body>
</html>
